name: Python Checks

on: pull_request

permissions:
  contents: read

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      pull-requests: read

  # =============================================================================
  # Fast checks that run quickly and catch common issues early
  # =============================================================================
  lint-and-format:
    name: Lint and Format
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.other == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint --directory py

      - name: Check lockfile is up to date
        run: uv lock --check --directory py

      - name: Format check
        run: uv run --no-sync --directory py ruff format --check --preview .

      - name: Lint with ruff
        run: uv run --no-sync --directory py ruff check --preview .

      # Every import is declared, and every declared dependency is imported.
      - name: Check dependencies match imports
        run: |
          for package in genkit genkit-google-genai genkit-mcp; do
            uv run --no-sync --directory "py/packages/$package" deptry src
          done

      - name: Run consistency checks
        run: python3 ./py/scripts/check_consistency.py

  # =============================================================================
  # Type checking (runs in parallel - each checker is a separate job)
  # =============================================================================
  type-check:
    name: Type Check (${{ matrix.checker }})
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.other == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checker: [ty, pyrefly, pyright]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint --directory py

      - name: Generate schema typing
        run: ./py/bin/generate_schema_typing --ci

      - name: Type check with Ty
        if: matrix.checker == 'ty'
        run: uv run --no-sync --directory py ty check .

      - name: Type check with Pyrefly
        if: matrix.checker == 'pyrefly'
        run: uv run --no-sync --directory py pyrefly check

      - name: Type check with Pyright
        if: matrix.checker == 'pyright'
        run: uv run --no-sync --directory py pyright

  # =============================================================================
  # Security and compliance checks
  # =============================================================================
  security-and-compliance:
    name: Security and Compliance
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.other == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint --directory py

      - name: Check source file license headers
        run: ./bin/check_license

      - name: Check Python dependency licenses
        run: uv run --no-sync --directory py liccheck -s pyproject.toml

      - name: Check for hardcoded secrets
        run: |
          cd py
          # Check for common API key patterns
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|AKIA[0-9A-Z]{16})" \
              packages/ samples/ --include="*.py" | grep -vE "test|mock|fake|example|#"; then
            echo "Error: Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  # =============================================================================
  # Unit tests across multiple Python versions (runs in parallel with other jobs)
  # =============================================================================
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.other == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          PY_VER: ${{ matrix.python-version }}
        run: uv sync --frozen --python "$PY_VER" --directory py

      - name: Generate schema typing
        run: ./py/bin/generate_schema_typing --ci

      - name: Run tests
        env:
          PY_VER: ${{ matrix.python-version }}
          COVERAGE_CORE: sysmon
        run: |
          if [[ "$PY_VER" == "3.12" ]]; then
            uv run --no-sync --python "$PY_VER" --directory py \
              pytest --cov --cov-report=term-missing:skip-covered
          else
            uv run --no-sync --python "$PY_VER" --directory py pytest
          fi

  # =============================================================================
  # Build verification (runs after tests pass)
  # =============================================================================
  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint-and-format, type-check, security-and-compliance, tests]
    if: >-
      ${{ !cancelled() &&
      needs.lint-and-format.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.security-and-compliance.result == 'success' &&
      needs.tests.result == 'success' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build and verify distributions
        run: ./py/bin/build_dists

      - name: Verify wheel contents
        run: |
          cd py
          for wheel in dist/*.whl; do
            if [[ -f "$wheel" ]]; then
              wheel_name=$(basename "$wheel" | sed 's/-[0-9].*//')
              # Only check publishable packages
              if [[ "$wheel_name" == "genkit" ]] || [[ "$wheel_name" == genkit_* ]]; then
                echo "Checking $wheel_name..."
                # Check for py.typed
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "py\.typed$"; then
                  echo "Warning: $wheel_name missing py.typed"
                fi
                # Check for LICENSE
                if ! unzip -l "$wheel" 2>/dev/null | grep -qE "(LICENSE|licenses/LICENSE)"; then
                  echo "Warning: $wheel_name missing LICENSE"
                fi
              fi
            fi
          done

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: py/dist/
          retention-days: 7

  # =============================================================================
  # Single fan-in gate job for main branch protection required_status_checks
  # =============================================================================
  python-checks:
    # Job name can be pinned in main branch protection required_status_checks.
    name: Run Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, lint-and-format, type-check, security-and-compliance, tests, build]
    if: >-
      ${{ always() && (needs.changes.result != 'success' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.schema == 'true' ||
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.other == 'true') }}
    steps:
      - name: Verify all Python jobs succeeded
        env:
          RESULTS: >-
            ${{ needs.lint-and-format.result }},${{ needs.type-check.result }},${{ needs.security-and-compliance.result }},${{ needs.tests.result }},${{ needs.build.result }}
        run: |
          echo "Python job results: $RESULTS"
          if [[ "$RESULTS" != "success,success,success,success,success" ]]; then
            echo "::error::One or more Python checks did not succeed: $RESULTS"
            exit 1
          fi
