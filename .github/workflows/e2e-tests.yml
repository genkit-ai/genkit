name: Run e2e tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Run e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Set up node v20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install && pnpm pnpm-install-workspaces
      - name: Run build script
        run: pnpm build
      - name: Run pack:all script
        run: pnpm pack:all
      - name: Install local Genkit
        run: pnpm link ./js/genkit
      - name: Run js tests
        run: pnpm test:js
      - name: Run e2e tests
        run: pnpm test:e2e
      - name: Validate working directory is clean
        run: .github/workflows/scripts/ensure-clean-working-tree.sh
