name: Run e2e tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Run e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up node v20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install && pnpm pnpm-install-workspaces
      - name: Run build script
        run: pnpm build
      - name: Run pack:all script
        run: pnpm pack:all
      - name: Install local Genkit
        run: pnpm link ./js/genkit
      - name: Run js tests
        run: pnpm test:js
      - name: Run e2e tests
        run: pnpm test:e2e
      - name: Validate working directory is clean
        run: .github/workflows/scripts/ensure-clean-working-tree.sh
