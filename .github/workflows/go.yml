name: Go tests and checks

on:
  pull_request:
    paths:
      - "go/**"
      - "genkit-tools/genkit-schema.json"
      - "tests/specs/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x', '1.27.x']
    # The PostgreSQL plugin's tests need a server; they skip without one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check if generated code is up to date
        run: bash .github/workflows/scripts/check-generated-go.sh

      - name: Check gofmt
        run: |
          fmt_files=$(go fmt ./...)
          if [ -n "$fmt_files" ]; then
            echo "Go files are not formatted. Please run 'go fmt ./...' and commit the changes:"
            echo "$fmt_files"
            exit 1
          fi
        working-directory: ./go

      - name: Run tests
        run: go test -C go -v ./...
        env:
          GENKIT_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/genkit_test?sslmode=disable
