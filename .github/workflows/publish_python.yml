# Publish all Python packages to PyPI.
#
# Triggered by pushing a tag like py/v0.7.0 or manually via workflow_dispatch.
# Auth uses PyPI trusted publishing (OIDC) — no API tokens needed.

name: Publish Python

on:
  push:
    tags:
      - "py/v*"
  workflow_dispatch:

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi_github_publishing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f94382f0613738c64287c71d6e159ea3f521c750 # v5.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.6.6"

      - name: Build and publish packages
        run: |
          set -uo pipefail

          # Publish all core and plugin packages for v0.9.0 release.
          PACKAGES=(
            py/packages/genkit
            py/packages/genkit-anthropic
            py/packages/genkit-django
            py/packages/genkit-evaluators
            py/packages/genkit-fastapi
            py/packages/genkit-flask
            py/packages/genkit-google-cloud
            py/packages/genkit-google-genai
            py/packages/genkit-middleware
            py/packages/genkit-ollama
            py/packages/genkit-openai
            py/packages/genkit-vertexai
          )

          FAILED=()
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::$pkg"
            if uv build "$pkg" --out-dir dist/; then
              echo "Build succeeded: $pkg"
            else
              echo "::error::Build failed: $pkg"
              FAILED+=("$pkg")
            fi
            echo "::endgroup::"
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed packages: ${FAILED[*]}"
            exit 1
          fi

          echo "::group::Build tombstone packages"
          python3 py/scripts/publish_tombstones.py --dist-dir dist/
          echo "::endgroup::"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76fac9e8c050a4b62767073286780c0587d10e54 # v1.12.3
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@42374261706d21bd6534fb08d3319b24873b5a9e # v5.3.0
        with:
          python-version: "3.12"
      - name: Smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#py/v}"
          [[ "$VERSION" == "$TAG" ]] && VERSION="${TAG#release/py/}"
          pip install "genkit==${VERSION}"
          python -c "from genkit import Genkit; Genkit(); print('ok')"
