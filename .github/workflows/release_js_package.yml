name: Release Genkit JS Package

on:
  workflow_dispatch:
    inputs:
      packageDir:
        description: Package dir (ex. js/foo)
        type: string
        required: true
      releaseTag:
        description: Release tag
        type: choice
        default: next
        required: true
        options:
          - next
          - latest

permissions: write-all

jobs:
  build:
    name: Run build tasks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Set up node v20
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20.x
        cache: 'pnpm'
    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch
    - name: Install dependencies
      run: pnpm install && pnpm pnpm-install-workspaces
    - name: Run build script
      run: pnpm build
    - name: Validate working directory is clean
      run: .github/workflows/scripts/ensure-clean-working-tree.sh
    - name: Set up node v20
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20.x
        cache: 'pnpm'
        registry-url: 'https://wombat-dressing-room.appspot.com/'
    - name: release script
      shell: bash
      run: |
          cd ${INPUTS_PACKAGEDIR}
          pnpm publish --tag ${{ inputs.releaseTag }} --publish-branch ${STEPS_EXTRACT_BRANCH_OUTPUTS_BRANCH} --access=public --registry https://wombat-dressing-room.appspot.com
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        INPUTS_PACKAGEDIR: ${{ inputs.packageDir }}
        STEPS_EXTRACT_BRANCH_OUTPUTS_BRANCH: ${{ steps.extract_branch.outputs.branch }}
