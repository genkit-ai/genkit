# Tests what a fresh `pip install genkit` resolves today: every dep at the
# newest version our bounds allow, not what uv.lock pins. Catches minor-version
# breaks (pydantic 2.14, google-genai 2.34) and uncapped majors before users
# report them. Floors are checked on every PR by the `lowest-deps` job in
# python.yml. Scheduled and manual only. See py/docs/dependencies.md.
name: Python Dependency Canary

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC, after Dependabot's weekly run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    name: Tests (newest allowed deps, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Re-resolve to the newest allowed versions
        run: |
          uv lock --upgrade --directory py
          git diff --stat py/uv.lock

      - name: Install dependencies
        env:
          PY_VER: ${{ matrix.python-version }}
        run: uv sync --frozen --python "$PY_VER" --directory py

      - name: Generate schema typing
        run: ./py/bin/generate_schema_typing --ci

      - name: Run tests
        env:
          PY_VER: ${{ matrix.python-version }}
        run: uv run --no-sync --python "$PY_VER" --directory py pytest
