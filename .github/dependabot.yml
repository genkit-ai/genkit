version: 2

# Policy notes:
# 1. Cooldowns satisfy zizmor (`dependabot-cooldown` >= 7d) and align npm workspaces
#    with our 21-day Airlock `minimumReleaseAge: 30240` policy.
# 2. Library ecosystems scope weekly grouped PRs to `minor` + `patch` and suppress
#    routine `version-update:semver-major` PRs via `ignore` (so breaking major jumps
#    that require code migrations are handled intentionally rather than turning the
#    weekly PR red). Security/CVE updates bypass both `cooldown` and `ignore`, opening
#    standalone PRs (including major bumps when required) outside the weekly group.
# 3. Exception: the Python `uv` workspace routes majors into a separate `py-major`
#    group instead of ignoring them. Published Python packages cap vendor SDKs, and
#    the major PR is how we learn a cap went stale.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for the root JS (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      root-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for the core JS workspace
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      js-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for genkit-tools
  - package-ecosystem: "npm"
    directory: "/genkit-tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      tools-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for JS samples workspace
  - package-ecosystem: "npm"
    directory: "/samples"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      samples-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for Python (uv workspace)
  # Majors get their own grouped PR instead of `ignore`: a red major PR doesn't
  # block the minor/patch PR, and it's the signal that a capped vendor SDK
  # shipped a new major. See py/docs/dependencies.md.
  - package-ecosystem: "uv"
    directory: "/py"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      py-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      py-major:
        patterns:
          - "*"
        update-types:
          - "major"
