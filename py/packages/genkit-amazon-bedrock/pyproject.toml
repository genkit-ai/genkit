[project]
authors = [{ name = "Google" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "License :: OSI Approved :: Apache Software License",
]
# botocore is imported directly (config, exceptions) and pins the floor that
# keeps the manual AWS_REGION lookup in transport.py necessary: it did not read
# AWS_REGION itself until 1.41.
dependencies = ["genkit", "boto3>=1.37.24", "botocore>=1.37.24", "structlog>=25.2.0"]
description = "Genkit Amazon Bedrock Plugin"
keywords = [
  "genkit",
  "ai",
  "llm",
  "machine-learning",
  "artificial-intelligence",
  "generative-ai",
  "aws",
  "bedrock",
  "amazon",
]
license = "Apache-2.0"
name = "genkit-amazon-bedrock"
readme = "README.md"
requires-python = ">=3.10"
version = "0.10.0"

[project.urls]
"Bug Tracker"   = "https://github.com/genkit-ai/genkit/issues"
Changelog       = "https://github.com/genkit-ai/genkit/blob/main/py/packages/genkit-amazon-bedrock/CHANGELOG.md"
"Documentation" = "https://firebase.google.com/docs/genkit"
"Homepage"      = "https://github.com/genkit-ai/genkit"
"Repository"    = "https://github.com/genkit-ai/genkit/tree/main/py"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
only-include = ["src/genkit_amazon_bedrock"]
sources      = ["src"]
