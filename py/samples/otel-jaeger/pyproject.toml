[project]
name = "otel-jaeger"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "genkit",
  "genkit-google-genai",
  "genkit-otel",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
