packages:
  - '.'
  - 'cli'
  - 'common'
  - 'telemetry-server'

# Strip internal proxy tarball URLs when resolving lockfiles locally.
pnpmfile: ../.pnpmfile.cjs

# 21-day minimum release age (in minutes) to align with Airlock soak policy.
minimumReleaseAge: 30240
