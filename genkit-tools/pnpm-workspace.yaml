packages:
  - '.'
  - 'cli'
  - 'common'
  - 'telemetry-server'

# Strip internal proxy tarball URLs when resolving lockfiles locally.
pnpmfile: ../.pnpmfile.cjs

# 21-day minimum release age (in minutes) to align with Airlock soak policy.
minimumReleaseAge: 30240

catalogMode: prefer
cleanupUnusedCatalogs: true

catalog:
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^20.19.43
  axios: ^1.21.0
  colorette: ^2.0.20
  cors: ^2.8.6
  express: ^5.3.0
  genversion: ^3.2.0
  get-port: ^7.2.0
  json-schema: ^0.4.0
  rimraf: ^6.1.3
  tsx: ^4.23.15
  typescript: ^5.9.3
  vitest: ^4.1.12
  yaml: ^2.9.1
  zod: 3.25.76
  zod-to-json-schema: ~3.25.2
